; ============================================================
; DarkSVT Ultimate v2.0 - Build Ready
; Updated for 2026 libraries (SmartRC v3, NimBLE 1.4.2)
; Target: ESP32-2432S028 (CYD) + NM-RF-HAT
; ============================================================

[platformio]
src_dir = src
lib_dir = lib
data_dir = data
default_envs = esp32-cyd-hat

[common]
platform = espressif32@6.7.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ARDUHAL_LOG_COLORS
    -D BOARD_HAS_PSRAM
    -D DARKSVT_VERSION="2.0"
    -D DARKSVT_EDITION="ULTIMATE"
    ; TFT_eSPI Display Config
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=40000000
    -D TOUCH_CS=21
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Hardware Pins
    -D SD_CS=5
    -D CC1101_CS=27
    -D CC1101_GDO0=22
    -D CC1101_GDO2=35
    -D NRF24_CSN=16
    -D NRF24_CE=17
    -D PN532_SS=13
    -D IR_TX_PIN=25
    -D IR_RX_PIN=26
    -D LED_PIN=33
    -D MIC_PIN=34
    -D IBUTTON_PIN=32

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4
    nRF24/RF24@^1.4.7
    z3t0/IRremote@^4.3.1
    greiman/SdFat@^2.2.2
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    h2zero/NimBLE-Arduino@^1.4.2
    miguelbalboa/MFRC522@^1.4.11
    paulstoffregen/OneWire@^2.3.8

[env:esp32-cyd-hat]
extends = common
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
build_flags =
    ${common.build_flags}
    -D BOARD_NM_RF_HAT=1

[env:esp32-cyd]
extends = common
board_build.partitions = default.csv

[env:esp32-e32r35t]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_E32R35T=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D CC1101_CS=21

[env:esp32-e32r28t]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_E32R28T=1
    -D CC1101_CS=21
