name: Build DarkSVT Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: |
          pio run -e esp32-cyd-hat

      - name: Upload BIN files
        uses: actions/upload-artifact@v4
        with:
          name: DarkSVT-BIN-Files
          path: |
            .pio/build/esp32-cyd-hat/bootloader.bin
            .pio/build/esp32-cyd-hat/partitions.bin
            .pio/build/esp32-cyd-hat/boot_app0.bin
            .pio/build/esp32-cyd-hat/firmware.bin
